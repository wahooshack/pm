<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management MVP</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #032147;
        --blue: #209dd7;
        --purple: #753991;
        --yellow: #ecad0a;
        --gray: #888888;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7fbff, #eef5ff);
        color: var(--navy);
        font-family: Arial, sans-serif;
      }
      main {
        background: white;
        border: 1px solid rgba(3, 33, 71, 0.12);
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(3, 33, 71, 0.08);
        padding: 2.5rem;
        text-align: center;
        max-width: 540px;
      }
      .badge {
        display: inline-block;
        background: rgba(236, 173, 10, 0.12);
        color: var(--navy);
        border-radius: 999px;
        padding: 0.5rem 0.9rem;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 700;
      }
      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        color: var(--gray);
        line-height: 1.6;
      }
      button {
        margin-top: 1rem;
        border: none;
        border-radius: 999px;
        background: var(--purple);
        color: white;
        padding: 0.85rem 1.25rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Hello world</span>
      <h1>Project Management MVP</h1>
      <p>The backend is serving a local app shell successfully.</p>
      <button type="button" onclick="fetch('/api/health').then(r => r.json()).then(data => alert(JSON.stringify(data, null, 2)))">
        Test API call
      </button>
    </main>
  </body>
</html>
